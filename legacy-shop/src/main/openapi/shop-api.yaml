openapi: 3.0.3
info:
  title: Legacy Shop API
  version: 1.1.0
  description: Catalog, customers, stock, orders, payments and shipping of the demo shop. Controllers are generated from this contract.
tags:
  - name: Products
  - name: Categories
  - name: Reviews
  - name: Customers
  - name: Inventory
  - name: PromoCodes
  - name: Orders
  - name: Payments
  - name: Shipments
  - name: Reports
paths:
  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: All products, or the products of one category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [Products]
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/products/{id}/reviews:
    get:
      tags: [Reviews]
      operationId: listReviews
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reviews of the product, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
    post:
      tags: [Reviews]
      operationId: addReview
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReview'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The customer has already reviewed this product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCategory'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '409':
          description: A category with this name exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/customers:
    post:
      tags: [Customers]
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCustomer'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/inventory/{productId}:
    get:
      tags: [Inventory]
      operationId: getStock
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Stock of the product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Inventory]
      operationId: setStock
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockUpdate'
      responses:
        '200':
          description: Updated stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/promo-codes:
    post:
      tags: [PromoCodes]
      operationId: createPromoCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCode'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCode'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/promo-codes/{code}:
    get:
      tags: [PromoCodes]
      operationId: getPromoCode
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The promo code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCode'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      parameters:
        - name: customerId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Orders of the customer, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags: [Orders]
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not enough stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/orders/{id}/history:
    get:
      tags: [Orders]
      operationId: getOrderHistory
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: What happened to the order, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEntry'
  /api/orders/{id}/payment:
    post:
      tags: [Payments]
      operationId: payOrder
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Result of the payment attempt; a declined payment leaves the order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The order is not waiting for payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/orders/{id}/shipment:
    post:
      tags: [Shipments]
      operationId: shipOrder
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Shipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The order is not paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/reports/sales:
    get:
      tags: [Reports]
      operationId: salesReport
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paid and shipped orders between the two dates, inclusive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReport'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    NewProduct:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
        categoryId:
          type: integer
          format: int64
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
        categoryId:
          type: integer
          format: int64
        rating:
          type: number
          description: Average review rating, absent when there are no reviews
    NewCategory:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    NewReview:
      type: object
      required: [customerId, rating]
      properties:
        customerId:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          maxLength: 500
    Review:
      type: object
      required: [id, productId, customerId, rating, createdAt]
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        rating:
          type: integer
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    NewCustomer:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    Customer:
      type: object
      required: [id, name, email, registeredAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        registeredAt:
          type: string
          format: date-time
    StockUpdate:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
    Stock:
      type: object
      required: [productId, available, reserved]
      properties:
        productId:
          type: integer
          format: int64
        available:
          type: integer
        reserved:
          type: integer
    PromoCode:
      type: object
      required: [code, percent, validUntil]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        percent:
          type: integer
          minimum: 1
          maximum: 50
        validUntil:
          type: string
          format: date
    NewOrderLine:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
    NewOrder:
      type: object
      required: [customerId, lines]
      properties:
        customerId:
          type: integer
          format: int64
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NewOrderLine'
        promoCode:
          type: string
    OrderLine:
      type: object
      required: [productId, productName, quantity, amount]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
        amount:
          type: number
    OrderStatus:
      type: string
      enum: [PLACED, PAID, SHIPPED, EXPIRED]
    Order:
      type: object
      required: [id, customerId, status, lines, itemsTotal, promoDiscount, delivery, total, placedAt]
      properties:
        id:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        itemsTotal:
          type: number
        promoCode:
          type: string
        promoDiscount:
          type: number
        delivery:
          type: number
        total:
          type: number
        placedAt:
          type: string
          format: date-time
    HistoryEntry:
      type: object
      required: [action, at]
      properties:
        action:
          type: string
        details:
          type: string
        at:
          type: string
          format: date-time
    PaymentStatus:
      type: string
      enum: [APPROVED, DECLINED]
    Payment:
      type: object
      required: [orderId, amount, status, processedAt]
      properties:
        orderId:
          type: integer
          format: int64
        amount:
          type: number
        status:
          $ref: '#/components/schemas/PaymentStatus'
        processedAt:
          type: string
          format: date-time
    Shipment:
      type: object
      required: [orderId, trackingNumber, shippedAt]
      properties:
        orderId:
          type: integer
          format: int64
        trackingNumber:
          type: string
        shippedAt:
          type: string
          format: date-time
    ProductSales:
      type: object
      required: [productName, quantity, revenue]
      properties:
        productName:
          type: string
        quantity:
          type: integer
          format: int64
        revenue:
          type: number
    SalesReport:
      type: object
      required: [from, to, orders, revenue, topProducts]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        orders:
          type: integer
          format: int64
        revenue:
          type: number
        topProducts:
          type: array
          items:
            $ref: '#/components/schemas/ProductSales'
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
