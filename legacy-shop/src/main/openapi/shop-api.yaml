openapi: 3.0.3
info:
  title: Legacy Shop API
  version: 1.0.0
  description: Catalog, customers, stock and orders of the demo shop. Controllers are generated from this contract.
tags:
  - name: Products
  - name: Customers
  - name: Inventory
  - name: Orders
paths:
  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      responses:
        '200':
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [Products]
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/customers:
    post:
      tags: [Customers]
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCustomer'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/inventory/{productId}:
    get:
      tags: [Inventory]
      operationId: getStock
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Stock of the product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Inventory]
      operationId: setStock
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockUpdate'
      responses:
        '200':
          description: Updated stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      parameters:
        - name: customerId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Orders of the customer, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags: [Orders]
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not enough stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    NewProduct:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
    Product:
      allOf:
        - $ref: '#/components/schemas/NewProduct'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    NewCustomer:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    Customer:
      type: object
      required: [id, name, email, registeredAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        registeredAt:
          type: string
          format: date-time
    StockUpdate:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
    Stock:
      type: object
      required: [productId, available, reserved]
      properties:
        productId:
          type: integer
          format: int64
        available:
          type: integer
        reserved:
          type: integer
    NewOrderLine:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
    NewOrder:
      type: object
      required: [customerId, lines]
      properties:
        customerId:
          type: integer
          format: int64
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NewOrderLine'
    OrderLine:
      type: object
      required: [productId, productName, quantity, amount]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
        amount:
          type: number
    OrderStatus:
      type: string
      enum: [PLACED, SHIPPED, EXPIRED]
    Order:
      type: object
      required: [id, customerId, status, lines, itemsTotal, delivery, total, placedAt]
      properties:
        id:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        itemsTotal:
          type: number
        delivery:
          type: number
        total:
          type: number
        placedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
